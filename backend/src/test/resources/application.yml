spring:
  application:
    name: sgt-online-backend
  datasource:
    # Suíte de integração: banco DEDICADO de teste (guarda no OnlineTesteBase aborta fora de *_test).
    url: ${ONLINE_DB_URL:jdbc:postgresql://localhost:5433/sgt_online_test}
    username: ${ONLINE_DB_USER:sgt_online}
    password: ${ONLINE_DB_PASSWORD:sgt_online}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${ONLINE_PORTA:8090}

management:
  endpoints:
    web:
      exposure:
        include: health

online:
  # Base EXTERNA usada na validação do `aud` do JWT do conector (o teste assina com props.baseUrl()).
  base-url: ${ONLINE_BASE_URL:http://localhost:8090}
  # 0 nos testes: o tempo mínimo de preenchimento é testado de forma determinística no FormTokenStoreTest.
  tempo-minimo-preenchimento: ${ONLINE_TEMPO_MINIMO:0s}
